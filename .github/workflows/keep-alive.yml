# Keep the hosted API awake on free-tier hosts that sleep after idle time.
# Runs about every 10 minutes (GitHub may delay cron slightly).

name: Keep alive

on:
  schedule:
    # Every 10 minutes — within the 5–10 min window you asked for.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit keep-alive URL
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "Missing GitHub secret KEEP_ALIVE_URL"
            exit 1
          fi
          echo "Pinging $KEEP_ALIVE_URL"
          curl -fsS --max-time 30 "$KEEP_ALIVE_URL"
          echo ""
          echo "OK"
