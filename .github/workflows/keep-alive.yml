# Keep the hosted API awake on free-tier hosts that sleep after idle time.

name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Hit keep-alive URL
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "Missing GitHub secret KEEP_ALIVE_URL"
            exit 1
          fi

          echo "Pinging $KEEP_ALIVE_URL"

          curl \
            --verbose \
            --location \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 15 \
            --max-time 180 \
            "$KEEP_ALIVE_URL"

          echo ""
          echo "✅ Backend is awake"